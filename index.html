<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הגדרות</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:#8a8a8e;--line:#e5e5ea;--blue:#3b82f6;--green:#34c759;--ga:.4;--glass:rgba(255,255,255,var(--ga));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--line:#38383a;--glass:rgba(40,40,44,var(--ga))}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;max-width:640px;margin-inline:auto;min-height:100vh;padding-bottom:6rem}
body.bold{font-weight:600}
body.noanim *{transition:none!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:3.4rem;display:flex;align-items:center;justify-content:center;font-weight:600;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.back{position:absolute;inset-inline-start:.9rem;width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);display:grid;place-items:center;color:var(--text);padding:0}
.back svg{width:1.1rem;height:1.1rem;stroke:currentColor;fill:none;stroke-width:2.4}
h1{font-size:2.1rem;margin:3.2rem 1.1rem .8rem}
.wrap{padding:0 .9rem}
.card{background:var(--card);border-radius:1.4rem;margin:.9rem 0;overflow:hidden}
.row{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;min-height:3.2rem;cursor:pointer;position:relative}
.row+.row::before{content:"";position:absolute;top:0;inset-inline:1rem;border-top:1px solid var(--line)}
.row.hi+.row.hi::before{inset-inline-start:3.7rem}.im{background:none;display:block;object-fit:cover}.phimg{width:6.6rem;display:block;margin:0 auto .6rem}
.ic{flex:none;width:1.9rem;height:1.9rem;border-radius:.5rem;display:grid;place-items:center}
.ic svg{width:1.2rem;height:1.2rem;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{flex:1}
.v{color:var(--sub);font-size:.95em}
.chev{width:.55rem;height:.55rem;border-left:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);opacity:.7;margin-inline-start:.1rem}
[dir=rtl] .chev{transform:rotate(45deg)}

.sw.on::after{opacity:1}
.foot{color:var(--sub);font-size:.82rem;margin:-.4rem 1.2rem 1rem;line-height:1.45}
.hd{color:var(--sub);font-size:.85rem;font-weight:600;margin:1.2rem 1.2rem .1rem}
.link{color:var(--blue)}
.intro{padding:1.2rem}
.intro .ic{width:4.2rem;height:4.2rem;border-radius:1rem}
.intro .ic svg{width:2.5rem;height:2.5rem}
.intro h2{margin:.7rem 0 .3rem}
.intro p{margin:0;color:var(--sub);line-height:1.5}
input[type=text],input[type=email]{border:0;background:none;color:var(--sub);font:inherit;text-align:start;width:55%;direction:ltr;outline:none}
.acct{display:flex;align-items:center;gap:.9rem;padding:.9rem 1rem}
img.av{background:none;display:block;object-fit:cover}
.av{width:3.4rem;height:3.4rem;border-radius:50%;background:linear-gradient(135deg,#9aa0b8,#5d6288);color:#fff;display:grid;place-items:center;font-size:1.3rem;font-weight:600}
.btn{display:block;width:100%;border:0;background:none;color:var(--blue);font:inherit;padding:.9rem;cursor:pointer;text-align:center}
.btn.red{color:#ff3b30}
.rd{flex:none;width:1.4rem;height:1.4rem;color:var(--blue)}
.rd svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.4}
.modes{display:flex;justify-content:space-around;padding:1.2rem 0 .6rem}
.mode{text-align:center;cursor:pointer}
.ph{width:5.6rem;height:9.6rem;border-radius:1rem;margin:0 auto .6rem;padding:2.2rem .5rem 0;color:#fff;font-weight:600;text-align:center}
.ph b{display:block;font-size:1.3rem;margin-top:-1.7rem;margin-bottom:1.1rem}
.ph i{display:block;height:1.2rem;border-radius:.4rem;background:#fff5;margin-bottom:.3rem}
.ph.l{background:linear-gradient(160deg,#c9b48a,#7a6650 55%,#e8e4dc)}
.ph.d{background:linear-gradient(160deg,#4a4c80,#10101c 55%,#55658f)}
.dot{width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid #8e8e93;margin:0 auto;display:grid;place-items:center}
.dot.on{background:var(--blue);border-color:var(--blue)}
.dot svg{width:.9rem;stroke:#fff;fill:none;stroke-width:3}
.sl{direction:ltr;display:flex;align-items:center;gap:.8rem;padding:1.1rem 1rem}
.sl input{flex:1;accent-color:var(--blue)}
.prev{height:12rem;border-radius:1.4rem;background:linear-gradient(135deg,#2f6b2a,#7fb069 40%,#9cc3e6);position:relative;overflow:hidden;margin:.9rem 0}
.prev .pill{position:absolute;inset-inline:1rem;bottom:1rem;height:2.6rem;border-radius:2rem;background:var(--glass);backdrop-filter:blur(14px);border:1px solid #fff6;display:flex;align-items:center;padding:0 1rem;color:var(--text)}
.chk{text-align:center;padding:5rem 1rem}
.chk .c{width:4rem;height:4rem;border-radius:50%;background:#8a8a8e;margin:0 auto 1.2rem;display:grid;place-items:center}
.chk .c svg{width:2rem;stroke:#fff;fill:none;stroke-width:3}
.pillbar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);inset-inline:.9rem;max-width:610px;margin-inline:auto;height:3.2rem;border-radius:2rem;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);display:flex;align-items:center;padding:0 1rem;gap:.6rem;z-index:6}
.pillbar input{flex:1;border:0;background:none;font:inherit;color:var(--text);outline:none;width:auto;direction:rtl;text-align:start}
.pillbar svg{width:1.3rem;stroke:var(--sub);fill:none;stroke-width:2}
#off{position:fixed;inset:0;background:#000;color:#555;display:none;place-items:center;z-index:99;font-size:.9rem}
[dir=ltr] .chev{transform:rotate(-135deg)}
[dir=ltr] .back svg{transform:scaleX(-1)}
[dir=ltr] .sw{transform:scaleX(-1)}
[dir=ltr] input[type=text],[dir=ltr] input[type=email]{text-align:end}
[dir=ltr] .pillbar input{direction:ltr}
</style>

const ENN={};const norm=s=>s.replace(/\u2011/g,'-').replace(/\u05f4/g,'"');
for(const k in EN)ENN[norm(k)]=EN[k];
for(const id in ENR){const r=RM[id];if(!r)continue;ENN[norm(r.t)]=ENR[id][0];if(r.d&&ENR[id][1])ENN[norm(r.d)]=ENR[id][1]}
const tr2=s=>st.lang==='en'?(ENN[norm(s)]||s):s;
function tr(){
 $('#q').placeholder=tr2('חיפוש');$('#off').textContent=tr2('הקש כדי להעיר את המסך');
 if(st.lang!=='en')return;
 const w=document.createTreeWalker($('#app'),NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode()){const s=n.nodeValue.trim();if(!s)continue;const e=ENN[norm(s)];
  if(e)n.nodeValue=n.nodeValue.replace(s,e);
  else if(s.startsWith('חשבון Apple:'))n.nodeValue=n.nodeValue.replace('חשבון Apple:','Apple Account:')}
 document.querySelectorAll('.sl span').forEach(x=>{if(x.textContent==='\u05d0')x.textContent='A'});
 document.querySelectorAll('#app [placeholder]').forEach(x=>{if(x.getAttribute('placeholder')==='השם שלך')x.placeholder='Your name'});
}
function render(){apply();const id=stack[stack.length-1];$('#app').innerHTML=view(id);$('#sb').style.display=id==='main'?'flex':'none';tr();window.scrollTo(0,0)}
function go(id){stack.push(id);render()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-tg],[data-back],[data-set],[data-act]');if(!t)return;
 if(t.dataset.back!==undefined){stack.pop();render();return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.tg){const k=t.dataset.tg;st.t[k]=T(k)?0:1;save();t.classList.toggle('on',!!st.t[k]);apply();if(k==='plane'||k==='auto')setTimeout(()=>{const y=scrollY;render();scrollTo(0,y)},320);return}
 if(t.dataset.set){const[k,v]=t.dataset.set.split(':');if(k==='theme'){st.theme=v;st.t.auto=0}else st[k]=v;save();const y=scrollY;render();scrollTo(0,y);return}
 const a=t.dataset.act;
 if(a==='in'){const n=$('#an').value.trim(),m=$('#ae').value.trim();if(!n||!m){alert(st.lang==='en'?'Please enter a name and email.':'יש למלא שם ואימייל');return}st.acct={name:n,email:m};save();render()}
 if(a==='out'){st.acct=null;save();render()}
 if(a==='more')alert(st.lang==='en'?'iOS '+AV('ios')+': your software is up to date.':'iOS '+AV('ios')+': המכשיר מעודכן לגירסה האחרונה הזמינה.');
 if(a==='off'){$('#off').style.display='grid'}
 if(a==='reset'&&confirm(st.lang==='en'?'Reset all settings on this site?':'לאפס את כל ההגדרות באתר?')){try{localStorage.removeItem('ios-settings')}catch(e){}location.reload()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.ab){st.ab[t.dataset.ab]=t.value;save()}
 if(t.dataset.in==='acctname'&&st.acct){st.acct.name=t.value||st.acct.name;save()}
 if(t.dataset.rg){st[t.dataset.rg]=+t.value;save();apply()}
});
$('#q').addEventListener('input',e=>{q=e.target.value;if(stack.length===1){$('#app').innerHTML=view('main');tr()}});
$('#off').addEventListener('click',()=>{$('#off').style.display='none'});
render();
</script>
